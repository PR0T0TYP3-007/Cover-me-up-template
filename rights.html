<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — Know your rights</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="rights" data-nav="rights">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <section class="hero stack-2">
        <span class="eyebrow">NHIA · <span id="sub"></span></span>
        <h1 style="font-size:2.25rem" data-i18n="rights.title"></h1>
        <div class="input-icon" style="max-width:560px">
          <i data-icon="search"></i>
          <input id="q" class="input" type="search" autocomplete="off" data-i18n-attr="placeholder:rights.search;aria-label:rights.search">
        </div>
      </section>
      <div class="chips scroll" role="group" aria-label="Topics" id="topics">
        <button type="button" class="chip" data-topic="all" aria-pressed="true" data-i18n="topic.all"></button>
        <button type="button" class="chip" data-topic="drugs" aria-pressed="false"><i data-icon="pill"></i><span data-i18n="topic.drugs"></span></button>
        <button type="button" class="chip" data-topic="payments" aria-pressed="false"><i data-icon="banknote"></i><span data-i18n="topic.payments"></span></button>
        <button type="button" class="chip" data-topic="referrals" aria-pressed="false"><i data-icon="referral"></i><span data-i18n="topic.referrals"></span></button>
        <button type="button" class="chip" data-topic="emergencies" aria-pressed="false"><i data-icon="heart"></i><span data-i18n="topic.emergencies"></span></button>
        <button type="button" class="chip" data-topic="access" aria-pressed="false"><i data-icon="shield-check"></i><span data-i18n="topic.access"></span></button>
      </div>
      <div class="grid-cards three" id="list" aria-live="polite">
        <div class="skeleton sk-card" style="height:150px"></div><div class="skeleton sk-card" style="height:150px"></div>
      </div>
    </main>

    <nav id="bottomnav"></nav>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/illustrations.js"></script>
  <script src="assets/js/pages/rights.js"></script>
</body>
</html>
