<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — Settings</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoverMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="settings" data-nav="settings">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <div class="page-head"><span class="eyebrow">CoverMe</span><h1 data-i18n="settings.title"></h1></div>
      <div class="cols-even">
        <div class="stack-3">

      <section class="stack" aria-labelledby="lang-h">
        <h2 id="lang-h" class="eyebrow" data-i18n="settings.language"></h2>
        <div class="segmented full" role="group" aria-labelledby="lang-h" id="lang">
          <button type="button" data-v="en" aria-pressed="false">English</button>
          <button type="button" data-v="pcm" aria-pressed="false">Pidgin</button>
        </div>
      </section>

      <section class="stack" aria-labelledby="theme-h">
        <h2 id="theme-h" class="eyebrow" data-i18n="settings.theme"></h2>
        <div class="segmented full" role="group" aria-labelledby="theme-h" id="theme">
          <button type="button" data-v="system" aria-pressed="false" data-i18n="theme.system"></button>
          <button type="button" data-v="light" aria-pressed="false" data-i18n="theme.light"></button>
          <button type="button" data-v="dark" aria-pressed="false" data-i18n="theme.dark"></button>
        </div>
      </section>

      <section class="stack" aria-labelledby="hmo-h">
        <h2 id="hmo-h" class="eyebrow" data-i18n="settings.insurance"></h2>
        <div class="list" id="insurance"></div>
        <p class="small muted" data-i18n="settings.backup"></p>
      </section>

      <section class="stack" aria-labelledby="notif-h">
        <h2 id="notif-h" class="eyebrow" data-i18n="settings.notif"></h2>
        <div class="list">
          <label class="list-item" for="notif">
            <i data-icon="bell"></i>
            <span class="grow"><span class="title" data-i18n="settings.notif"></span><br><span class="sub" id="notif-sub" data-i18n="settings.notif.sub"></span></span>
            <span class="switch"><input type="checkbox" id="notif" role="switch"><span class="track"></span></span>
          </label>
        </div>
      </section>

        </div>
        <div class="stack-3">
      <section class="stack" aria-labelledby="priv-h">
        <h2 id="priv-h" class="eyebrow" data-i18n="settings.privacy"></h2>
        <div class="list">
          <a class="list-item" href="privacy.html"><i data-icon="lock"></i><span class="grow title" data-i18n="settings.privacyNotice"></span><i data-icon="chevron-right" class="chev"></i></a>
          <a class="list-item" href="index.html?replay=1"><i data-icon="refresh"></i><span class="grow title" data-i18n="settings.replay"></span><i data-icon="chevron-right" class="chev"></i></a>
          <button type="button" class="list-item" id="install" hidden><i data-icon="install"></i><span class="grow"><span class="title" data-i18n="settings.install"></span><br><span class="sub" data-i18n="settings.install.sub"></span></span><i data-icon="download" class="chev"></i></button>
        </div>
      </section>

      <!-- Demo tools for the showcase (Nov 16 / Nov 21) -->
      <section class="stack" aria-labelledby="demo-h">
        <h2 id="demo-h" class="eyebrow" data-i18n="settings.demo"></h2>
        <div class="list">
          <label class="list-item" for="demo">
            <i data-icon="zap"></i>
            <span class="grow"><span class="title" data-i18n="settings.demoMode"></span><br><span class="sub" data-i18n="settings.demoMode.sub"></span></span>
            <span class="switch"><input type="checkbox" id="demo" role="switch"><span class="track"></span></span>
          </label>
          <button type="button" class="list-item" id="seed"><i data-icon="sparkle"></i><span class="grow title" data-i18n="settings.seed"></span><i data-icon="chevron-right" class="chev"></i></button>
          <label class="list-item" for="simerr">
            <i data-icon="wifi-off"></i>
            <span class="grow"><span class="title" data-i18n="settings.simError"></span><br><span class="sub" data-i18n="settings.simError.sub"></span></span>
            <span class="switch"><input type="checkbox" id="simerr" role="switch"><span class="track"></span></span>
          </label>
        </div>
      </section>

      <section class="stack" aria-labelledby="del-h">
        <h2 id="del-h" class="sr-only" data-i18n="settings.delete"></h2>
        <button type="button" class="btn btn-danger-outline btn-lg btn-block" id="delete"><i data-icon="trash"></i><span data-i18n="settings.delete"></span></button>
        <p class="small muted" style="text-align:center" data-i18n="settings.delete.sub"></p>
      </section>

      <p class="small muted mono" style="text-align:center" data-i18n="settings.version"></p>
        </div>
      </div>
    </main>

    <nav id="bottomnav"></nav>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/install.js"></script>
  <script src="assets/js/pages/settings.js"></script>
</body>
</html>
