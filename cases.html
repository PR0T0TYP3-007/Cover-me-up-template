<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — My cases</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoverMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="cases" data-nav="cases">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <div class="page-head">
        <span class="eyebrow" id="count"></span>
        <h1 data-i18n="cases.title"></h1>
      </div>
      <div class="segmented" role="group" aria-label="Filter cases" id="filter" style="align-self:flex-start">
        <button type="button" data-f="all" aria-pressed="true" data-i18n="cases.all"></button>
        <button type="button" data-f="open" aria-pressed="false" data-i18n="cases.open"></button>
        <button type="button" data-f="closed" aria-pressed="false" data-i18n="cases.closed"></button>
      </div>
      <div class="grid-cards" id="list" aria-live="polite">
        <div class="skeleton sk-card"></div><div class="skeleton sk-card"></div><div class="skeleton sk-card"></div>
      </div>
    </main>

    <div class="action-bar">
      <a class="btn btn-primary btn-lg btn-block" href="home.html"><i data-icon="plus"></i><span data-i18n="cases.new"></span></a>
    </div>
    <nav id="bottomnav"></nav>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/install.js"></script>
  <script src="assets/js/illustrations.js"></script>
  <script src="assets/js/pages/cases.js"></script>
</body>
</html>
