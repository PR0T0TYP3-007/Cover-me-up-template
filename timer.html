<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — 1-hour timer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoverMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="timer" data-back="home.html" data-hard-back="1" data-title="timer.title">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <div class="cols">
        <div class="col-main">
          <section class="card timer-wrap" aria-labelledby="timer-status" style="background-image:var(--pattern-ink)">
            <span class="demo-pill" id="demo-pill" hidden data-i18n="timer.demo"></span>
            <div class="timer-ring" id="ring" data-phase="ok">
              <svg viewBox="0 0 260 260" aria-hidden="true">
                <circle class="ticks" cx="130" cy="130" r="124" fill="none" stroke-width="6" stroke-dasharray="1.6 11.39"/>
                <circle class="track" cx="130" cy="130" r="104" fill="none" stroke-width="16"/>
                <circle class="bar" id="bar" cx="130" cy="130" r="104" fill="none" stroke-width="16" stroke-linecap="round"/>
              </svg>
              <div class="center">
                <span class="time" id="time" role="timer" aria-live="off">60:00</span>
                <span class="label" id="time-label" data-i18n="timer.left"></span>
              </div>
            </div>
            <div class="stack" style="align-items:center;text-align:center">
              <h1 id="timer-status" style="font-size:1.75rem"></h1>
              <p class="mono muted" id="deadline"></p>
              <span class="badge badge-amber" id="approx" hidden><i data-icon="help"></i><span data-i18n="timer.approx"></span></span>
            </div>
          </section>
          <p class="sr-only" id="announce" aria-live="polite"></p>

          <div class="banner banner-danger" id="overdue-banner" hidden role="alert">
            <i data-icon="alert"></i>
            <span><strong data-i18n="timer.overdueTitle"></strong><span data-i18n="timer.overdueBody"></span></span>
          </div>
        </div>

        <div class="col-side">
          <div class="banner banner-info" id="install-prompt" hidden style="position:relative;padding-right:48px">
            <i data-icon="bell"></i>
            <span class="stack" style="gap:8px"><strong data-i18n="timer.install.title"></strong><span id="install-body"></span>
              <button type="button" class="btn btn-primary" id="install-go" style="align-self:flex-start;min-height:44px"><i data-icon="plussq"></i><span data-i18n="timer.install.btn"></span></button></span>
            <button type="button" class="icon-btn" id="install-x" data-i18n-attr="aria-label:common.dismiss" style="position:absolute;top:4px;right:4px"><i data-icon="x"></i></button>
          </div>
          <div id="call"></div>
          <section class="card stack-2" aria-labelledby="sofar-title">
            <h2 id="sofar-title" class="eyebrow" data-i18n="timer.sofar"></h2>
            <div id="timeline"></div>
          </section>
        </div>
      </div>
    </main>

    <div class="action-bar">
      <div class="btn-row">
        <button type="button" class="btn btn-secondary btn-lg" id="responded"><i data-icon="phone"></i><span data-i18n="timer.responded"></span></button>
        <a class="btn btn-primary btn-lg" id="escalate" href="#"><i data-icon="flag"></i><span data-i18n="timer.escalate"></span></a>
      </div>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/install.js"></script>
  <script src="assets/js/pages/timer.js"></script>
</body>
</html>
