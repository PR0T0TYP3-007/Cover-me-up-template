<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — Set up</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="setup">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <div class="row-between">
        <button type="button" class="icon-btn" id="step-back" data-i18n-attr="aria-label:common.back" style="margin-left:-12px"><i data-icon="arrow-left"></i></button>
        <div class="progress-dots" id="progress" aria-hidden="true"><span></span><span></span><span></span></div>
        <button type="button" class="link-btn" id="skip" data-i18n="common.skip"></button>
      </div>
      <p class="sr-only" id="step-label" aria-live="polite"></p>

      <!-- Step 1: HMO picker -->
      <section class="stack-2" data-step="1" aria-labelledby="hmo-title">
        <div class="stack">
          <h1 id="hmo-title" data-i18n="setup.hmo.title"></h1>
          <p class="muted" data-i18n="setup.hmo.hint"></p>
        </div>
        <div class="input-icon">
          <i data-icon="search"></i>
          <input id="hmo-search" class="input" type="search" autocomplete="off" data-i18n-attr="placeholder:setup.hmo.search;aria-label:setup.hmo.search">
        </div>
        <div class="list hmo-list" id="hmo-list" role="listbox" aria-labelledby="hmo-title"></div>
        <button type="button" class="link-btn" id="hmo-unsure" data-i18n="setup.hmo.notSure"></button>
      </section>

      <!-- Step 2: plan type -->
      <section class="stack-2" data-step="2" hidden aria-labelledby="plan-title">
        <div class="stack">
          <h1 id="plan-title" data-i18n="setup.plan.title"></h1>
          <p class="muted" data-i18n="setup.plan.hint"></p>
        </div>
        <div class="stack" role="radiogroup" aria-labelledby="plan-title" id="plans">
          <button type="button" class="choice" role="radio" aria-checked="false" data-plan="nhia">
            <span class="ic"><i data-icon="shield-check"></i></span>
            <span class="grow"><span class="title" data-i18n="setup.plan.nhia"></span><br><span class="small muted" data-i18n="setup.plan.nhia.sub"></span></span>
            <span class="check"><i data-icon="check"></i></span>
          </button>
          <button type="button" class="choice" role="radio" aria-checked="false" data-plan="state">
            <span class="ic"><i data-icon="hospital"></i></span>
            <span class="grow"><span class="title" data-i18n="setup.plan.state"></span><br><span class="small muted" data-i18n="setup.plan.state.sub"></span></span>
            <span class="check"><i data-icon="check"></i></span>
          </button>
          <button type="button" class="choice" role="radio" aria-checked="false" data-plan="private">
            <span class="ic"><i data-icon="user"></i></span>
            <span class="grow"><span class="title" data-i18n="setup.plan.private"></span><br><span class="small muted" data-i18n="setup.plan.private.sub"></span></span>
            <span class="check"><i data-icon="check"></i></span>
          </button>
          <button type="button" class="choice" role="radio" aria-checked="false" data-plan="unsure">
            <span class="ic"><i data-icon="help"></i></span>
            <span class="grow"><span class="title" data-i18n="setup.plan.unsure"></span><br><span class="small muted" data-i18n="setup.plan.unsure.sub"></span></span>
            <span class="check"><i data-icon="check"></i></span>
          </button>
        </div>
      </section>

      <!-- Step 3: hospital -->
      <section class="stack-2" data-step="3" hidden aria-labelledby="hosp-title">
        <div class="stack">
          <h1 id="hosp-title" data-i18n="setup.hosp.title"></h1>
          <p class="muted" data-i18n="setup.hosp.hint"></p>
        </div>
        <div class="field">
          <label for="hospital" data-i18n="setup.hosp.label"></label>
          <div class="input-icon">
            <i data-icon="hospital"></i>
            <input id="hospital" class="input" type="text" autocomplete="organization" maxlength="120" data-i18n-attr="placeholder:setup.hosp.placeholder">
          </div>
        </div>
      </section>
    </main>

    <div class="action-bar">
      <button type="button" class="btn btn-primary btn-lg btn-block" id="continue"><span data-i18n="common.continue"></span><i data-icon="arrow-right"></i></button>
    </div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/illustrations.js"></script>
  <script src="assets/js/pages/setup.js"></script>
</body>
</html>
