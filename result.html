<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B5D4B">
  <meta name="format-detection" content="telephone=no">
  <title>CoverMe — Your answer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CoverMe">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>try{var s=JSON.parse(localStorage.getItem('cm.settings')||'{}');if(s.theme==='light'||s.theme==='dark')document.documentElement.dataset.theme=s.theme}catch(e){}</script>
</head>
<body data-page="result" data-back="home.html" data-hard-back="1" data-title="result.title">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header id="topbar"></header>

    <main id="main" class="main">
      <!-- Loading skeleton -->
      <div id="loading" class="stack-2" aria-hidden="true">
        <div class="card stack"><div class="skeleton sk-line" style="width:40%"></div><div class="skeleton sk-title"></div><div class="skeleton sk-title" style="width:50%"></div></div>
        <div class="card stack"><div class="skeleton sk-line"></div><div class="skeleton sk-line"></div><div class="skeleton sk-line" style="width:60%"></div></div>
      </div>

      <!-- Error state: never a dead end, always the HMO number -->
      <section id="error" class="stack-2" hidden aria-labelledby="err-title">
        <div class="banner banner-danger" role="alert">
          <i data-icon="wifi-off"></i>
          <span><strong id="err-title" data-i18n="error.title"></strong><span data-i18n="error.body"></span></span>
        </div>
        <div id="err-call"></div>
        <button type="button" class="btn btn-primary btn-lg btn-block" id="retry"><i data-icon="refresh"></i><span data-i18n="error.retry"></span></button>
        <p class="label" data-i18n="error.pick"></p>
        <div class="chips">
          <button type="button" class="chip" data-hint="drug_refused" data-key="chip.buyOutside"><i data-icon="pill"></i><span data-i18n="chip.buyOutside"></span></button>
          <button type="button" class="chip" data-hint="cash_demanded" data-key="chip.payCash"><i data-icon="banknote"></i><span data-i18n="chip.payCash"></span></button>
          <button type="button" class="chip" data-hint="auth_delay" data-key="chip.waitApproval"><i data-icon="hourglass"></i><span data-i18n="chip.waitApproval"></span></button>
          <button type="button" class="chip" data-hint="referral_delay" data-key="chip.referral"><i data-icon="referral"></i><span data-i18n="chip.referral"></span></button>
        </div>
      </section>

      <!-- The answer -->
      <div id="answer" class="stack-2" hidden></div>
    </main>

    <div class="action-bar" id="actions" hidden></div>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/install.js"></script>
  <script src="assets/js/pages/result.js"></script>
</body>
</html>
